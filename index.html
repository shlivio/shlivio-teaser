<style>
  :root {
    --bg: #DCE8D5;
    --text: #2C3B2A;
    --text-muted: #5C6E58;
    --gold: #C9A24B;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 32px 48px;
  }

  .logo {
    display: inline-flex;
    align-items: flex-end;
    gap: 14px;
    text-decoration: none;
  }

  .logo-symbol {
    height: 52px;
    width: auto;
  }

  .logo-word {
    height: 34px;
    width: auto;
  }

  .sun {
    transform-box: fill-box;
    transform-origin: center;
    animation: breathe 3.4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.18); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sun { animation: none; }
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    text-align: center;
  }

  h1.tagline {
    font-size: 56px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.15;
    margin: 0 0 16px;
  }

  p.more {
    font-size: 16px;
    color: var(--text-muted);
    margin: 0;
  }

  footer {
    padding: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
  }

  footer a {
    color: var(--text-muted);
  }

  footer a:hover {
    color: var(--text);
  }

  footer .links {
    margin-bottom: 8px;
  }

  footer .links a {
    margin: 0 8px;
  }

  @media (max-width: 600px) {
    header { padding: 20px; }
    .logo { gap: 11px; }
    .logo-symbol { height: 42px; }
    .logo-word { height: 27px; }
    h1.tagline { font-size: 34px; }
  }
</style>
</head>
